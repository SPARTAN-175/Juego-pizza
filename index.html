<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14231d"><meta name="description" content="Simulador de reparto de pizza con conducción libre y tráfico urbano.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Pizza Delivery Simulator 0.6</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="styles.css">
</head>
<body><main id="game"><div id="map"></div>
<header class="topbar"><div class="brand"><span class="brand-icon">🍕</span><div><b>PIZZA DELIVERY</b><small>FREE DRIVE · 0.6</small></div></div><div class="stats"><div><small>VELOCIDAD</small><b><span id="speed">0</span><i> km/h</i></b></div><div><small>NIVEL</small><b>⭐ <span id="level">1</span></b></div><div><small>ENTREGAS</small><b>🍕 <span id="deliveries">0</span></b></div><div><small>TIEMPO</small><b>⏱ <span id="timer">00:00</span></b></div></div></header>
<section class="mission"><div class="mission-top"><span class="pulse"></span> PEDIDO ACTIVO</div><b id="missionName">Buscando calles…</b><span id="missionDistance">Cargando red vial</span><div class="mission-bottom"><span id="routeStatus">Preparando mapa</span><b id="routeKm">—</b></div><button id="deliver" disabled>ENTREGAR PIZZA</button></section>
<div class="map-tools"><button id="follow" class="tool active">◎<span>SEGUIR</span></button><button id="searchArea" class="tool">⌕<span>ZONA</span></button><button id="mapStyle" class="tool">◫<span>COLOR</span></button><button id="buildings" class="tool active">⌂<span>CASAS</span></button><button id="zoomIn" class="tool">＋</button><button id="zoomOut" class="tool">－</button></div>
<div class="speed-panel"><span class="speed-dot"></span><span id="driveStatus">CARGANDO CALLES…</span></div>
<div class="controls"><div class="control-cluster steering"><button id="left" class="control-button turn" aria-label="Girar a la izquierda">◀<small>IZQ.</small></button><button id="right" class="control-button turn" aria-label="Girar a la derecha">▶<small>DER.</small></button></div><div class="control-cluster driving"><button id="brake" class="control-button brake">▼<small>FRENO</small></button><button id="accelerate" class="control-button accelerate">▲<small>GAS</small></button></div></div>
<div id="toast" role="status"></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></body></html>
