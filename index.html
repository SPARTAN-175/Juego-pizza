<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14231d">
<title>Pizza Delivery Simulator 2.0</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css">
<link rel="stylesheet" href="styles.css"><link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<main id="game">
  <div id="map"></div>

  <header class="topbar">
    <div class="brand"><span class="brand-icon">🍕</span><div><b>PIZZA DELIVERY</b><small>STREET EDITION · 2.1</small></div></div>
    <div class="stats">
      <div><small>VELOCIDAD</small><b><span id="speed">0</span><i> km/h</i></b></div>
      <div><small>NIVEL</small><b>⭐ <span id="level">1</span></b></div><div><small>ENTREGAS</small><b>🍕 <span id="deliveries">0/3</span></b></div><div><small>TIEMPO</small><b>⏱ <span id="timer">00:00</span></b></div>
    </div>
  </header>

  <section class="mission">
    <div class="mission-top"><span class="pulse"></span> PEDIDO ACTIVO</div>
    <b id="missionName">Cliente 1</b>
    <span id="missionDistance">Calculando ruta…</span>
    <div class="mission-bottom"><span id="routeStatus">Preparando navegación</span><b id="routeKm">—</b></div>
    <div id="travelEstimate" class="travel-estimate" aria-live="polite"></div>
    <button id="deliver" disabled>ENTREGAR PIZZA</button>
  </section>

  <div class="map-tools">
    <button id="follow" class="tool active" title="Seguir repartidor">◎ <span>SEGUIR</span></button>
    <button id="searchArea" class="tool" title="Buscar otra localidad">⌕</button>
    <button id="mapStyle" class="tool" title="Cambiar vista del mapa">◫ <span>Color</span></button>
    <button id="freeDrive" class="tool" title="Activar conducción libre">🧭 <span>MODO LIBRE</span></button>
    <button id="offlineMap" class="tool" title="Estado del mapa sin conexión">⬇ <span>OFFLINE</span></button>
    <button id="zoomIn" class="tool" title="Acercar">＋</button>
    <button id="zoomOut" class="tool" title="Alejar">－</button>
  </div>

  <div class="speed-panel"><span class="speed-dot"></span><span id="driveStatus">LISTO PARA SALIR</span></div>

  <div class="controls">
    <div class="control-cluster driving">
      <button id="brake" class="control-button brake">▼<small>FRENO / REVERSA</small></button>
      <button id="accelerate" class="control-button accelerate">▲<small>ACELERAR</small></button>
      <button id="autoDrive" class="control-button auto-drive">🤖<small>AUTO</small></button>
    </div>
  </div>

  <div id="toast" role="status"></div>
  <div id="featureRoot"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
<script src="app.js"></script><script>if("serviceWorker" in navigator && location.protocol!=="file:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.warn));}</script>
<div id="keyboardHint" aria-hidden="true">TECLADO: W / ↑ AVANZAR · S / ↓ REVERSA</div>
</body>
</html>
